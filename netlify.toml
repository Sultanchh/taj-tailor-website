# Netlify Configuration for Taj Tailor Frontend
# This file configures Netlify build settings and deployment

[build]
  # Base directory where the project root is
  base = "."
  
  # Build command to create production build (frontend only)
  command = "pnpm install && pnpm run build:netlify"
  
  # Directory containing the built frontend (output)
  publish = "client/dist"

[build.environment]
  # Node.js version for build
  NODE_VERSION = "22.13.0"
  
  # pnpm version
  PNPM_VERSION = "9.0.0"

# Redirect all routes to index.html for React Router SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache headers for HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Context-specific settings
[context.production]
  command = "pnpm install && pnpm run build:netlify"
  
[context.deploy-preview]
  command = "pnpm install && pnpm run build:netlify"
  
[context.branch-deploy]
  command = "pnpm install && pnpm run build:netlify"

# Environment variables (these should be set in Netlify dashboard)
# VITE_APP_ID = "your-app-id"
# VITE_APP_TITLE = "Taj Tailor"
# VITE_OAUTH_PORTAL_URL = "https://api.manus.im"
# VITE_FRONTEND_FORGE_API_URL = "https://api.manus.im"
# VITE_FRONTEND_FORGE_API_KEY = "your-api-key"
